function setM(m){document.body.classList.remove('m-jp','m-us');document.body.classList.add('m-'+m);document.querySelectorAll('.ptabs button').forEach(b=>b.classList.toggle('on',b.dataset.m===m))}
(function(){const j=new Date(Date.now()+(new Date().getTimezoneOffset()+540)*60000);const hm=j.getHours()*60+j.getMinutes();const wd=j.getDay();
 setM(wd>=1&&wd<=5&&hm>=480&&hm<945?'jp':'us')})();
document.querySelectorAll('.ptabs button').forEach(b=>b.addEventListener('click',()=>{setM(b.dataset.m);window.scrollTo(0,0)}));
